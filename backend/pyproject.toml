[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resumeiq-backend"
version = "1.0.0"
description = "ResumeIQ DSA-Driven Match Engine & Algorithm Lab Backend"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
    "pdfplumber",
    "pypdfium2"
]

[tool.setuptools]
packages = ["algorithms", "pipeline", "benchmark"]

[tool.vercel]
entrypoint = "main:app"
